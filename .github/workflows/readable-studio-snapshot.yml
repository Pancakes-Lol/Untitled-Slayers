name: Make Studio snapshot readable

on:
  push:
    branches: [main]
    paths:
      - 'studio-export/snapshot.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readable-studio-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Split and validate snapshot
        run: python scripts/split_studio_snapshot.py
      - name: Upload readable snapshot
        uses: actions/upload-artifact@v4
        with:
          name: readable-studio-snapshot-${{ github.sha }}
          path: studio-export/readable/
          if-no-files-found: error
          retention-days: 30
